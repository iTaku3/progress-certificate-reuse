[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "progress-certificate-reuse"
version = "0.1.0"
description = "Finite preliminary experiments on reusable progress certificates"
requires-python = ">=3.10"
authors = [{name = "Takuto Yamauchi"}]

[tool.setuptools.packages.find]
where = ["src"]
